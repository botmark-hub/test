<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom smooth transition for tab switching */
        .page-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Ambient background glow elements -->
    <div class="fixed top-1/4 -left-20 w-80 h-80 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-1/4 -right-20 w-80 h-80 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- MAIN CONTAINER -->
    <main class="w-full max-w-md relative z-10">

        <!-- LOGIN / SIGNUP CARD -->
        <div id="loginCard"
            class="page-transition opacity-100 scale-100 bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 shadow-2xl rounded-2xl p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <div
                    class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600/20 text-indigo-400 rounded-xl mb-3 border border-indigo-500/30">
                    <i class="fa-solid font-bold fa-lock text-2xl"></i>
                </div>
                <h1 id="cardTitle" class="text-2xl font-bold text-white tracking-tight">Welcome Back</h1>
<p id="cardSubtitle" class="text-sm text-slate-400 mt-1">Please enter your details to sign in</p>
            </div>

            <!-- Form -->
            <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">

                <!-- Email/Username Input -->
                <div>
                    <label for="identity"
                        class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                        Email or Username
                    </label>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-regular fa-user text-sm"></i>
                        </div>
                        <input type="text" id="identity" required placeholder="admin@example.com"
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-900/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm text-slate-100 placeholder-slate-500 transition-all" />
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="password"
                            class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                            Password
                        </label>
                        <a href="#" onclick="showToast('Password reset link sent to registered email!')"
                            class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors">
                            Forgot?
                        </a>
                    </div>
                    <div class="relative">
                        <div
                            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-key text-sm"></i>
                        </div>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full pl-10 pr-10 py-2.5 bg-slate-900/60 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm text-slate-100 placeholder-slate-500 transition-all" />
                        <button type="button" onclick="togglePasswordVisibility()"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 transition-colors">
                            <i id="eyeIcon" class="fa-regular fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Checkbox (ใส่ id เพื่อให้ซ่อนตอนกดสมัครสมาชิกได้) -->
                <div id="rememberContainer" class="flex items-center justify-between text-sm">
                    <label class="flex items-center space-x-2 cursor-pointer select-none">
                        <input type="checkbox" id="rememberMe"
                            class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-800" />
                        <span class="text-slate-300 text-xs font-medium">Remember me</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn"
                    class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2">
                    <span id="btnText">Sign In</span>
                    <i id="btnSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                </button>
            </form>

            <!-- Bottom helper text (ส่วนสลับโหมดที่เพิ่มให้แล้วครับ) -->
            <p class="text-center text-xs text-slate-500 mt-6">
    <span id="toggleText">Don't have an account? </span>
    <a href="#" id="toggleLink" onclick="toggleMode(); return false;" class="text-indigo-400 hover:underline">Sign up</a>
</p>
            </p>
        </div>

        <!-- BLANK / EMPTY PAGE SCREEN (Hidden initially) -->
        <div id="blankScreen"
            class="hidden page-transition opacity-0 scale-95 fixed inset-0 bg-slate-950 flex flex-col items-center justify-center z-50 p-6">
            <div class="text-center space-y-4">
                <div
                    class="inline-flex items-center justify-center w-12 h-12 bg-slate-900 border border-slate-800 text-slate-500 rounded-full">
                    <i class="fa-regular fa-square text-xl"></i>
                </div>
                <h2 class="text-slate-400 font-medium text-lg">Blank Page View</h2>
                <p class="text-slate-600 text-sm max-w-xs mx-auto">
                    You have successfully authenticated. This is an empty workspace layout.
                </p>

                <div class="pt-6">
                    <button onclick="handleLogout()"
                        class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white rounded-xl text-xs font-semibold tracking-wide transition-all shadow-md flex items-center space-x-2 mx-auto">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <span>Return / Logout</span>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Notification Toast Container -->
    <div id="toast"
        class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-800 border border-slate-700 text-slate-200 px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3">
        <i id="toastIcon" class="fa-solid fa-circle-info text-indigo-400"></i>
        <span id="toastMsg" class="text-xs font-medium">Notification</span>
    </div>

    <!-- Logic Script -->
    <script>
        // ตัวแปรเก็บสถานะปัจจุบันว่าเป็นโหมด 'login' หรือ 'signup'
        let currentMode = 'login';

        // ฟังก์ชันสำหรับสลับโหมดระหว่าง Login และ Sign Up
        function toggleMode() {
            currentMode = currentMode === 'login' ? 'signup' : 'login';

            const cardTitle = document.getElementById('cardTitle');
            const cardSubtitle = document.getElementById('cardSubtitle');
            const btnText = document.getElementById('btnText');
            const toggleText = document.getElementById('toggleText');
            const toggleLink = document.getElementById('toggleLink');
            const rememberContainer = document.getElementById('rememberContainer');

            if (currentMode === 'signup') {
                cardTitle.textContent = "Create Account";
                cardSubtitle.textContent = "Please enter your details to sign up";
                btnText.textContent = "Sign Up";
                toggleText.innerHTML = "Already have an account? ";
                toggleLink.textContent = "Sign in";
                rememberContainer.classList.add('hidden'); // ซ่อนปุ่ม Remember me ตอนสมัครสมาชิก
            } else {
                cardTitle.textContent = "Welcome Back";
                cardSubtitle.textContent = "Please enter your details to sign in";
                btnText.textContent = "Sign In";
                toggleText.innerHTML = "Don't have an account? ";
                toggleLink.textContent = "Sign up";
                rememberContainer.classList.remove('hidden'); // แสดงปุ่ม Remember me ตอนเข้าสู่ระบบ
            }
        }

        // Toggle password visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Handle Form Submission (รองรับทั้ง Login และ Sign Up ตามโหมดปัจจุบัน)
        async function handleLogin(event) {
            event.preventDefault();

            const identityInput = document.getElementById('identity').value;
            const passwordInput = document.getElementById('password').value;

            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const loginCard = document.getElementById('loginCard');
            const blankScreen = document.getElementById('blankScreen');

            // กำหนด Endpoint ตามโหมดที่เลือก
            const endpoint = currentMode === 'signup'
                ? 'http://localhost:3000/api/signup'
                : 'http://localhost:3000/api/login';

            btnText.textContent = currentMode === 'signup' ? "Signing up..." : "Signing in...";
            btnSpinner.classList.remove('hidden');

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: identityInput,
                        password: passwordInput
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showToast(result.message || (currentMode === 'signup' ? "สมัครสมาชิกสำเร็จ!" : "เข้าสู่ระบบสำเร็จ!"));

                    // หน่วงเวลาเล็กน้อยแล้วเปลี่ยนหน้าไปหน้า Blank Screen
                    setTimeout(() => {
                        loginCard.classList.remove('opacity-100', 'scale-100');
                        loginCard.classList.add('opacity-0', 'scale-95');

                        setTimeout(() => {
                            loginCard.classList.add('hidden');
                            blankScreen.classList.remove('hidden');
                            void blankScreen.offsetWidth;
                            blankScreen.classList.remove('opacity-0', 'scale-95');
                            blankScreen.classList.add('opacity-100', 'scale-100');

                            // Reset button state
                            btnText.textContent = currentMode === 'signup' ? "Sign Up" : "Sign In";
                            btnSpinner.classList.add('hidden');
                        }, 300);
                    }, 500);

                } else {
                    showToast(result.message || "เกิดข้อผิดพลาด");
                    btnText.textContent = currentMode === 'signup' ? "Sign Up" : "Sign In";
                    btnSpinner.classList.add('hidden');
                }

            } catch (error) {
                console.error('Connection error:', error);
                showToast("ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้");
                btnText.textContent = currentMode === 'signup' ? "Sign Up" : "Sign In";
                btnSpinner.classList.add('hidden');
            }
        }

        // Handle Logout / Return to Login Form
        function handleLogout() {
            const loginCard = document.getElementById('loginCard');
            const blankScreen = document.getElementById('blankScreen');

            blankScreen.classList.remove('opacity-100', 'scale-100');
            blankScreen.classList.add('opacity-0', 'scale-95');

            setTimeout(() => {
                blankScreen.classList.add('hidden');

                loginCard.classList.remove('hidden');
                void loginCard.offsetWidth;
                loginCard.classList.remove('opacity-0', 'scale-95');
                loginCard.classList.add('opacity-100', 'scale-100');

                document.getElementById('loginForm').reset();
            }, 300);
        }

        // Toast Notification helper
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = message;

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }   
    </script>
</body>

</html>
